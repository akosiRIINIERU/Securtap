
[functions.tuya-lock-status]
enabled = true
verify_jwt = false
import_map = "./functions/tuya-lock-status/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/tuya-lock-status/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/tuya-lock-status/*.html" ]

# Called by pg_cron with a shared secret, not by a signed-in user.
[functions.lock-events-sync]
enabled = true
verify_jwt = false
entrypoint = "./functions/lock-events-sync/index.ts"
